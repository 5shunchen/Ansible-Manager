[project]
name = "ansible-manager"
version = "0.1.0"
description = "Ansible host management platform: SSH monitoring, playbook execution, containerd deployment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0.29",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "email-validator>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # passlib 1.7.4 与 bcrypt>=4.1 不兼容（backend 探测阶段即抛错），必须钉住
    "bcrypt==4.0.1",
    "asyncssh>=2.14",
    "paramiko>=3.4",
    "ansible-runner>=2.3",
    "ansible-core>=2.16",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
